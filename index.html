<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
<link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <table>
        <tr> <td><h1>Login | <span id="registerTitle">Register</span></h1>
                <h4>Enter your email and password to register.</h4>
            <div>    
                <input type="text" placeholder="Username">
            </div>
            <div>
                <input type="email" placeholder="Enter your email address">
            </div>
            <div class ="password-wrapper">
                <input type="password" placeholder="Password">
                <span class="eye-icon"> <img src="Hide.png" alt="eye-icon" width="20" height="20"></span>
            </div>
            <div>
                <input type="password" placeholder="Confirm Password">
            </div>
                <button type="submit" id="registerButton">Register</button>
                <h4>Or register with</h4> 
                <div> 
                    <button type="button">
                        <img src="img/google-logo.png" alt="Google Logo" width="20" height="20">
                        Continue with Google</button>
                </div> 
                <div> 
                    <button type="button">
                        <img src="img/facebook-logo_1080029-107.avif" alt="Facebook Logo" width="20" height="20">
                        Continue with Facebook</button>
                </div> 
            </td> 
        </tr> 
    </table> 
</body>
</html>
