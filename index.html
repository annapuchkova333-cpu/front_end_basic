<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Greenshop Home</title>
<link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="header">
    <div class="header-container">
        <a href="/" class="header-logo">
            <img src="img/Logo.png" alt="Greenshop Logo">
        </a>
        <nav class="header-nav">
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link">Shop</a>
            <a href="#" class="nav-link">Plant Care</a>
            <a href="#" class="nav-link">Blogs</a>
        </nav>
        <div class="header-login">
            <button class="login-button-green">
                    <img src="img/Logout.png" alt="Login">
                Login
            </button>
        </div>
    </div>
</header>
<section class="hero">
    <div class="container">
        <div class="hero_content">
            <p class="hero_label">WELCOME TO GREENSHOP</p>
            <h1 class="hero_title">LET'S MAKE A BETTER<span> PLANET</span></h1>
            <p class="hero_text">We are an online plant shop offering a wide range of cheap and trendy plants. Use<br>our plants to create an unique Urban Jungle. Order your favorite plants!</p>
            <button class="shop-button-green">SHOP NOW</button>
        </div>
        <div class="hero_image">
            <img src="img/plant.png" alt="Plant in pot">
        </div>
    </div>
</section>
</body>
</html>
