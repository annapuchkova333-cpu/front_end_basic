<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <style> 
    body {text-align: center;}
        table {border: 2px solid white; 
            margin: 50px auto;       
            border-collapse: collapse;}
            td {padding: 40px;} 
            div {margin-top: 15px; margin-bottom: 15px;} 
            #registerButton {background-color: #46A358; width: 300px; height: 45px; border-radius: 5px; color: white; border-color: #46A358;}   
            button {background-color: white; width: 300px; height: 45px; border-radius: 5px; border: 1px solid black; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 10px;}
            input {width: 300px; height: 45px; border-radius: 5px; border: 1px solid black; box-sizing: border-box; padding: 10px; font-family: inherit;}
            #registerTitle {color: #46A358;}
            .password-wrapper {position:relative ; width: 300px; margin : 0 auto;}
            .password-wrapper input {width : 100%; padding: 10px; padding-right: 40px; box-sizing: border-box;}
            .eye-icon {position :absolute ; right: 10px; top: 50%; transform: translateY(-50%); color: #888; font-size: 20px; z-index: 2;}
    </style>
</head>
<body style="background-color: #1E1E1E;">
  <table style="background-color: white; border-bottom: #46A358 solid 10px;"
        <tr> <td><h1>Login | <span id="registerTitle">Register</span></h1>
                <h4>Enter your email and password to register.</h4>
            <div>    
                <input type="text" placeholder="Username">
            </div>
            <div>
                <input type="email" placeholder="Enter your email address">
            </div>
            <div class ="password-wrapper">
                <input type="password" placeholder="Password">
                <span class="eye-icon"> <img src="Hide.png" alt="eye-icon" width="20" height="20"></span>
            </div>
            <div>
                <input type="password" placeholder="Confirm Password">
            </div>
                <button type="submit" id="registerButton">Register</button>
                <h4>Or register with</h4> 
                <div> 
                    <button type="button">
                        <img src="google-logo.jpg" alt="Google Logo" width="20" height="20">
                        Continue with Google</button>
                </div> 
                <div> 
                    <button type="button">
                        <img src="facebook-logo_1080029-107.avif" alt="Facebook Logo" width="20" height="20">
                        Continue with Facebook</button>
                </div> 
            </td> 
        </tr> 
    </table> 
</body>
</html>
