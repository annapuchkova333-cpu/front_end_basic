<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
<link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <table>
        <tr> <td>
            <button class="close-btn" type="button">
                <img src="img/close.svg" alt="Close">
            </button>
            <h1>Login | <span id="registerTitle">Register</span></h1>
                <h4>Enter your email and password to register</h4>
            <div>    
                <input type="text" placeholder="Username">
            </div>
            <div>
                <input type="email" placeholder="Enter your email address">
            </div>
            <div class ="password-wrapper">
                <input type="password" placeholder="Password">
                <span class="eye-icon"> <img src="img/hide.svg" alt="eye-icon" width="20" height="20"></span>
            </div>
            <div>
                <input type="password" placeholder="Confirm Password">
            </div>
                <label class="checkbox-terms">
                    <input type="checkbox" class="checkbox-hidden">
                    <span class="checkbox-custom"><img src="img/approved.svg" alt="check" class="checkbox-icon"></span>
                    <span class="checkbox-text">I agree to the terms and conditions</span>
                </label>
                <button type="submit" id="registerButton">Register</button>
                <div class="divider"><span>Or register with</span></div> 
                <div> 
                    <button type="button" class="register-form-button">
                        <img src="img/google.svg" alt="Google Logo" width="20" height="20">
                        Continue with Google</button>
                </div> 
                <div> 
                    <button type="button" class="register-form-button">
                        <img src="img/facebook.svg" alt="Facebook Logo" width="20" height="20">
                        Continue with Facebook</button>
                </div> 
            </td> 
        </tr> 
    </table> 
</body>
</html>
